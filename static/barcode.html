<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Code Kunjungan</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  </head>
  <body
    class="bg-light d-flex align-items-center justify-content-center min-vh-100 p-3"
  >
    <div
      id="card"
      class="bg-white rounded-3 shadow p-4 text-center"
      style="max-width: 360px; width: 100%"
    >
      <div class="mb-4">
        <img
          src="/static/assets/img/Logo.png"
          alt="Logo"
          class="img-fluid"
          style="width: 70px; height: 70px; object-fit: contain"
        />
      </div>

      <h1 class="h5 fw-bold text-dark mb-3">QR Code Kunjungan</h1>

      <div id="qrCode" class="mb-4 d-flex justify-content-center">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>

      <div id="visitorInfo" class="text-start small lh-lg text-muted"></div>

      <div class="alert alert-warning text-center mt-3">
        <i class="bi bi-clock-history"></i>
        <strong>Perhatian:</strong> Barcode ini hanya berlaku selama
        <b>24 Jam</b> sejak didaftarkan.
      </div>

      <button
        id="downloadBtn"
        class="btn btn-primary mt-4 d-inline-flex align-items-center gap-2"
        style="height: 38px; font-size: 0.85rem; padding: 0 1rem"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          fill="currentColor"
          viewBox="0 0 16 16"
        >
          <path
            d="M.5 9.9a.5.5 0 0 1 .5-.5h4V2a.5.5 0 0 1 1 0v7.5h4a.5.5 0 0 1 .354.854l-5 5a.5.5 0 0 1-.708 0l-5-5A.5.5 0 0 1 .5 9.9z"
          />
          <path d="M8 0a.5.5 0 0 1 .5.5V7h-1V.5A.5.5 0 0 1 8 0z" />
        </svg>
        <span>Download QR (.jpg)</span>
      </button>

      <p class="text-muted small mt-3">
        Simpan gambar ini sebagai bukti kunjungan
      </p>
    </div>

    <script>
      // AMBIL DATA DARI URL
      const urlParams = new URLSearchParams(window.location.search);
      const barcode = urlParams.get("code") || "BC" + Date.now();
      const nama = urlParams.get("nama") || "";
      const status = urlParams.get("status_kunjungan") || "";
      const jenis_kendaraan = urlParams.get("kendaraan") || "";
      const nomor_kendaraan = urlParams.get("nomor") || "";
      const now = new Date();

      const visitorData = {
        nama,
        status,
        jenis_kendaraan,
        nomor_kendaraan,
        barcode,
      };

      // DEBUG
      console.log("Data dari URL:", visitorData);

      // QR TEXT
      const qrText = `
Nama: ${nama}
Status: ${status}
Kendaraan: ${jenis_kendaraan ? jenis_kendaraan + " - " + nomor_kendaraan : "-"}
Waktu: ${now.toLocaleString("id-ID", {
        dateStyle: "medium",
        timeStyle: "short",
      })}
Barcode: ${barcode}
  `.trim();

      // BUAT QR
      const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(
        qrText,
      )}`;
      const qrImg = new Image();
      qrImg.crossOrigin = "anonymous";
      qrImg.src = qrUrl;
      qrImg.className = "img-fluid";
      qrImg.style.maxWidth = "220px";
      qrImg.style.border = "8px solid white";
      qrImg.style.borderRadius = "8px";
      qrImg.style.boxShadow = "0 4px 12px rgba(0,0,0,0.1)";

      qrImg.onload = () => {
        const qrContainer = document.getElementById("qrCode");
        qrContainer.innerHTML = "";
        qrContainer.appendChild(qrImg);
      };

      // INFO
      const infoDiv = document.getElementById("visitorInfo");
      infoDiv.innerHTML = `
    <p class="mb-1"><strong>Nama:</strong> ${nama}</p>
    <p class="mb-1"><strong>Status:</strong> ${status}</p>
    ${
      jenis_kendaraan
        ? `<p class="mb-1"><strong>Kendaraan:</strong> ${jenis_kendaraan} - ${nomor_kendaraan}</p>`
        : ""
    }
    <p class="mb-1"><strong>Waktu:</strong> ${now.toLocaleString("id-ID", {
      dateStyle: "medium",
      timeStyle: "short",
    })}</p>
    <p class="mb-0"><strong>Barcode:</strong> <span style="font-size: 1 rem; font-weight: bold; letter-spacing: 2px;">${barcode}</span></p>  
  `;

      // DOWNLOAD
      document
        .getElementById("downloadBtn")
        .addEventListener("click", async () => {
          const card = document.getElementById("card");
          const canvas = await html2canvas(card, {
            scale: 2,
            useCORS: true,
            backgroundColor: "#ffffff",
          });
          const link = document.createElement("a");
          const namaFile = (nama || "Pengunjung").replace(/[^a-zA-Z0-9]/g, "_");
          link.download = `QR_${namaFile}_${now
            .toISOString()
            .slice(0, 10)}.jpg`;
          link.href = canvas.toDataURL("image/jpeg", 0.95);
          link.click();
        });
    </script>
  </body>
</html>

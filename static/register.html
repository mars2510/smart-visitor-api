<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visitor Registration</title>

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/assets/css/style.css" />
  </head>
  <body
    class="bg-light d-flex justify-content-center align-items-center min-vh-100 p-3"
  >
    <div
      class="bg-white shadow-lg rounded-3 p-4 p-md-5 w-100"
      style="max-width: 500px"
    >
      <div class="text-center mb-4">
        <img
          src="/static/assets/img/logo.png"
          alt="Logo"
          class="img-fluid"
          style="width: 80px; height: 80px; object-fit: contain"
        />
      </div>

      <form id="visitorForm" class="row g-3">
        <!-- Nama Sesuai KTP -->
        <div class="col-12">
          <label class="form-label fw-semibold">Nama Sesuai KTP</label>
          <input
            type="text"
            id="nama"
            required
            class="form-control"
            style="height: 40px"
          />
        </div>

        <!-- Status Kunjungan -->
        <div class="col-12">
          <label class="form-label fw-semibold">Status Kunjungan</label>
          <select
            id="status"
            class="form-select select-pulse"
            style="height: 40px"
          >
            <option value="">Pilih Status</option>
            <option value="Tamu Umum">Tamu Umum</option>
            <option value="Supplier">Supplier</option>
            <option value="Vendor">Vendor</option>
            <option value="Kedinasan">Kedinasan</option>
            <option value="Lainnya">Lainnya</option>
          </select>
        </div>

        <!-- Hanya untuk Lainnya -->
        <div id="lainnyaFields" class="d-none">
          <div class="col-12">
            <label class="form-label fw-semibold">Keterangan</label>
            <input
              type="text"
              id="keterangan"
              placeholder="Kurir, Pengantar, dll."
              class="form-control text-secondary mb-2"
              style="height: 40px"
            />
          </div>

          <div class="col-12">
            <label class="form-label fw-semibold">Kendaraan</label>
            <div class="row g-2">
              <div class="col-4">
                <select
                  id="jenisKendaraanLainnya"
                  class="form-select select-pulse"
                  style="height: 40px"
                >
                  <option value="">Jenis</option>
                  <option value="Motor">Motor</option>
                  <option value="Mobil">Mobil</option>
                  <option value="Umum">Umum</option>
                </select>
              </div>
              <div class="col-8">
                <input
                  type="text"
                  id="noKendaraanLainnya"
                  class="form-control"
                  placeholder="Nomor Kendaraan"
                  style="height: 40px"
                />
              </div>
            </div>
          </div>
        </div>

        <!-- SEMUA FIELD LAIN -->
        <div id="regularFields">
          <div class="col-12">
            <label class="form-label fw-semibold">Jumlah Pengunjung</label>
            <input
              type="number"
              id="jumlah"
              min="1"
              value="1"
              class="form-control"
              style="height: 40px"
            />
          </div>
          <br />

          <div class="col-12">
            <label class="form-label fw-semibold"
              >Nama Pengunjung Lainnya</label
            >
            <textarea
              id="nama_lain"
              rows="3"
              class="form-control"
              placeholder="Jika ada..."
              style="min-height: 80px; resize: vertical"
            ></textarea>
          </div>
          <br />

          <div class="col-12">
            <label class="form-label fw-semibold">Nomor Telepon</label>
            <input
              type="text"
              id="telepon"
              class="form-control"
              placeholder="08xxxx"
              inputmode="numeric"
              style="height: 40px"
            />
          </div>
          <br />

          <!-- ALAMAT / PT -->
          <div class="col-12">
            <label class="form-label fw-semibold">Alamat / PT</label>
            <div class="input-group position-relative mb-3">
              <input
                type="text"
                id="alamat"
                placeholder="Ketik atau pilih PT..."
                class="form-control combobox-input"
                autocomplete="off"
                style="height: 40px"
              />
              <button
                type="button"
                class="combobox-toggle btn btn-light border"
                style="
                  height: 40px;
                  width: 40px;
                  border-left: none;
                  border-radius: 0 0.375rem 0.375rem 0;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                "
              >
                <i class="bi bi-chevron-down" style="font-size: 0.75rem"></i>
              </button>
            </div>
          </div>

          <div class="col-12">
            <div class="row g-2">
              <div class="col-4">
                <select
                  id="jenisKendaraan"
                  class="form-select select-pulse"
                  style="height: 40px"
                >
                  <option value="">Jenis</option>
                  <option value="Motor">Motor</option>
                  <option value="Mobil">Mobil</option>
                  <option value="Umum">Umum</option>
                </select>
              </div>
              <div class="col-8">
                <input
                  type="text"
                  id="noKendaraan"
                  class="form-control"
                  placeholder="Nomor Kendaraan"
                  style="height: 40px"
                />
              </div>
            </div>
          </div>
          <br />

          <!-- TUJUAN KUNJUNGAN -->
          <div class="col-12">
            <label class="form-label fw-semibold">Tujuan Kunjungan</label>
            <div id="tujuanContainer">
              <div class="border p-3 rounded">
                <div class="input-group position-relative mb-2">
                  <input
                    type="text"
                    placeholder="POS / Perusahaan Tujuan"
                    class="form-control combobox-input pos-input"
                    data-field="pos"
                    style="height: 40px"
                  />
                  <button
                    type="button"
                    class="combobox-toggle btn btn-light border"
                    style="
                      height: 40px;
                      width: 40px;
                      border-left: none;
                      border-radius: 0 0.375rem 0.375rem 0;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                    "
                  >
                    <i
                      class="bi bi-chevron-down"
                      style="font-size: 0.75rem"
                    ></i>
                  </button>
                </div>
                <input
                  type="text"
                  placeholder="Bertemu dengan"
                  class="form-control mb-2"
                  style="height: 40px"
                />
                <input
                  type="text"
                  placeholder="Bagian"
                  class="form-control mb-2"
                  style="height: 40px"
                />
                <input
                  type="text"
                  placeholder="Keperluan"
                  class="form-control"
                  style="height: 40px"
                />
              </div>
            </div>

            <div class="d-flex justify-content-between mt-3">
              <button
                type="button"
                id="addContainer"
                class="btn btn-primary"
                style="height: 40px"
              >
                + Tambah Tujuan
              </button>
              <button
                type="button"
                id="removeContainer"
                class="btn btn-danger d-none"
                style="height: 40px"
              >
                - Hapus Tujuan
              </button>
            </div>
          </div>
        </div>

        <!-- Tombol Simpan -->
        <div class="col-12">
          <button
            type="submit"
            class="btn btn-success w-100 fw-semibold"
            style="height: 40px"
          >
            Simpan
          </button>
        </div>
      </form>
    </div>

    <!-- POPUP TAMBAH TUJUAN -->
    <div
      id="popupOverlay"
      class="position-fixed top-0 start-0 w-100 h-100 d-none justify-content-center align-items-center"
      style="background: rgba(0, 0, 0, 0.4); z-index: 1050"
    >
      <div class="bg-white rounded-3 p-4 shadow" style="width: 320px">
        <h2 class="h5 fw-semibold text-center mb-3">Tambah Tujuan</h2>
        <form id="popupForm" class="row g-3">
          <div class="col-12">
            <div class="input-group position-relative">
              <input
                type="text"
                id="popupPos"
                placeholder="POS / Perusahaan Tujuan"
                class="form-control combobox-input pos-input"
                data-field="pos"
                style="height: 40px"
              />
              <button
                type="button"
                class="combobox-toggle btn btn-light border"
                style="
                  height: 40px;
                  width: 40px;
                  border-left: none;
                  border-radius: 0 0.375rem 0.375rem 0;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                "
              >
                <i class="bi bi-chevron-down" style="font-size: 0.75rem"></i>
              </button>
            </div>
          </div>
          <div class="col-12">
            <input
              type="text"
              id="popupBertemu"
              placeholder="Bertemu dengan"
              class="form-control mb-0"
              style="height: 40px"
            />
          </div>
          <div class="col-12">
            <input
              type="text"
              id="popupBagian"
              placeholder="Bagian"
              class="form-control mb-0"
              style="height: 40px"
            />
          </div>
          <div class="col-12">
            <input
              type="text"
              id="popupKeperluan"
              placeholder="Keperluan"
              class="form-control"
              style="height: 40px"
            />
          </div>
          <div class="col-12 d-flex justify-content-end gap-2 mt-3">
            <button
              type="button"
              id="cancelPopup"
              class="btn btn-secondary"
              style="height: 40px"
            >
              Batal
            </button>
            <button type="submit" class="btn btn-primary" style="height: 40px">
              OK
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Bootstrap JS + Custom JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/assets/js/main.js?v=3" defer></script>
  </body>
</html>

{% extends "admin_base.html" %} {% block content %}
<div class="card border-0">
  <div
    class="card-header bg-white py-3 d-flex flex-column align-items-stretch gap-3"
  >
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
      <h5 class="mb-0 fw-semibold">
        <i class="bi bi-people text-primary"></i> Data Riwayat Pengunjung
      </h5>
      <div class="d-flex gap-2">
        <button class="btn btn-sm btn-outline-success" onclick="exportVisitors('xlsx')">
          <i class="bi bi-file-earmark-excel"></i> Excel
        </button>
        <button class="btn btn-sm btn-outline-primary" onclick="exportVisitors('csv')">
          <i class="bi bi-filetype-csv"></i> CSV
        </button>
      </div>
    </div>

    <div class="d-flex flex-wrap align-items-end gap-2">
      <div>
        <label for="periodFilter" class="form-label small text-muted mb-1">Periode</label>
        <select id="periodFilter" class="form-select form-select-sm" onchange="onPeriodChange()">
          <option value="day" selected>Per Hari</option>
          <option value="month">Per Bulan</option>
          <option value="all">Semua Data</option>
        </select>
      </div>
      <div id="dayFilterGroup">
        <label for="dateFilter" class="form-label small text-muted mb-1">Tanggal</label>
        <input id="dateFilter" type="date" class="form-control form-control-sm" onchange="fetchVisitors(1)" />
      </div>
      <div id="monthFilterGroup" class="d-none">
        <label for="monthFilter" class="form-label small text-muted mb-1">Bulan</label>
        <input id="monthFilter" type="month" class="form-control form-control-sm" onchange="fetchVisitors(1)" />
      </div>
      <div class="input-group input-group-sm ms-md-auto" style="max-width: 340px">
        <input
          type="text"
          id="searchInput"
          class="form-control"
          placeholder="Cari Nama / No HP / Barcode..."
        />
        <button class="btn btn-primary" onclick="fetchVisitors(1)" aria-label="Cari">
          <i class="bi bi-search"></i>
        </button>
      </div>
    </div>
  </div>

  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover table-striped mb-0">
        <thead class="table-light">
          <tr>
            <th class="ps-4">Nama / Kontak</th>
            <th>Alamat / PT</th>
            <th>Kendaraan</th>
            <th>Tipe</th>
            <th>Status</th>
            <th>Waktu Daftar</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="visitor-table-body">
          <tr>
            <td colspan="7" class="text-center py-4 text-muted">
              Memuat data...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Footer Pagination -->
  <div
    class="card-footer bg-white d-flex justify-content-between align-items-center py-3"
  >
    <span class="text-muted small" id="pagination-info"
      >Menampilkan 0 dari 0 data</span
    >
    <nav aria-label="Page navigation">
      <ul class="pagination pagination-sm mb-0" id="pagination-controls">
        <!-- Tombol halaman akan di-generate oleh JS -->
      </ul>
    </nav>
  </div>
</div>

<script>
  let currentPage = 1;

  function selectedFilters() {
    const period = document.getElementById("periodFilter").value;
    return {
      period,
      date_filter: period === "day" ? document.getElementById("dateFilter").value : "",
      month_filter: period === "month" ? document.getElementById("monthFilter").value : "",
    };
  }

  function onPeriodChange() {
    const period = document.getElementById("periodFilter").value;
    document.getElementById("dayFilterGroup").classList.toggle("d-none", period !== "day");
    document.getElementById("monthFilterGroup").classList.toggle("d-none", period !== "month");
    fetchVisitors(1);
  }

  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, (character) => {
      const entities = {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      };
      return entities[character];
    });
  }

  function exportVisitors(format) {
    const filters = selectedFilters();
    const params = new URLSearchParams({
      format,
      period: filters.period,
      date_filter: filters.date_filter,
      month_filter: filters.month_filter,
      search: document.getElementById("searchInput").value.trim(),
    });
    window.location.href = `/api/v1/admin/visitors/export?${params}`;
  }

  async function fetchVisitors(page = 1) {
    const search = document.getElementById("searchInput").value.trim();
    const filters = selectedFilters();
    const tbody = document.getElementById("visitor-table-body");

    tbody.innerHTML =
      '<tr><td colspan="7" class="text-center py-4 text-muted">Memuat data...</td></tr>';

    try {
      const params = new URLSearchParams({
        page,
        limit: 10,
        search,
        period: filters.period,
        date_filter: filters.date_filter,
        month_filter: filters.month_filter,
      });
      const response = await fetch(`/api/v1/admin/visitors?${params}`);
      if (!response.ok) throw new Error("Gagal memuat data pengunjung.");
      const result = await response.json();

      const data = result.data;
      const meta = result.meta;

      tbody.innerHTML = "";

      if (data.length === 0) {
        tbody.innerHTML =
          '<tr><td colspan="7" class="text-center py-4 text-muted">Data tidak ditemukan.</td></tr>';
        document.getElementById("pagination-info").innerText =
          "Menampilkan 0 dari 0 data";
        document.getElementById("pagination-controls").innerHTML = "";
        return;
      }

      data.forEach((item) => {
        let badgeClass = "bg-secondary";
        if (item.status === "SELESAI") badgeClass = "bg-primary";
        if (item.status === "DALAM_LOKASI") badgeClass = "bg-success";
        if (item.status === "DALAM_KUNJUNGAN")
          badgeClass = "bg-warning text-dark";
        if (item.status === "DITOLAK") badgeClass = "bg-danger";
        if (item.status === "HILANG") badgeClass = "bg-dark";
        const expiredActions = item.can_resolve_expired
          ? `<button class="btn btn-sm btn-outline-warning" data-visit-id="${escapeHtml(item.id_kunjungan)}" data-resolution="HILANG">Tandai Hilang</button>
             <button class="btn btn-sm btn-outline-primary" data-visit-id="${escapeHtml(item.id_kunjungan)}" data-resolution="SELESAI">Selesaikan</button>`
          : '<span class="text-muted">-</span>';

        tbody.innerHTML += `
        <tr>
            <td class="ps-4">
                <div class="fw-semibold">${escapeHtml(item.nama)}</div>
                <div class="small text-muted">${escapeHtml(item.telepon || "-")} | <span class="font-monospace">${escapeHtml(item.kode_qr)}</span></div>
            </td>
            <td>${escapeHtml(item.alamat)}</td>
            <td>${escapeHtml(item.kendaraan)}</td>
            <td>${escapeHtml(item.tipe_kunjungan)}</td>
            <td><span class="badge ${badgeClass}">${escapeHtml(item.status)}</span></td>
            <td class="text-muted small">${escapeHtml(item.waktu_daftar)}</td>
            <td><div class="d-flex gap-1">${expiredActions}</div></td>
        </tr>
    `;
      });
      // Update Info Pagination
      const startData = (meta.page - 1) * meta.limit + 1;
      const endData = Math.min(meta.page * meta.limit, meta.total_data);
      document.getElementById("pagination-info").innerText =
        `Menampilkan ${startData} - ${endData} dari ${meta.total_data} data`;

      renderPagination(meta.total_pages, meta.page);
      currentPage = meta.page;
    } catch (error) {
      console.error("Gagal mengambil data:", error);
      tbody.innerHTML =
        '<tr><td colspan="7" class="text-center py-4 text-danger">Terjadi kesalahan saat memuat data.</td></tr>';
    }
  }

  document.getElementById("visitor-table-body").addEventListener("click", (event) => {
    const button = event.target.closest("button[data-visit-id]");
    if (button) {
      resolveExpiredVisit(button.dataset.visitId, button.dataset.resolution);
    }
  });

  async function resolveExpiredVisit(visitId, status) {
    const catatan = prompt(
        `Catatan admin untuk menandai kunjungan sebagai ${status}:`,
    );
    if (catatan === null) return;
    if (!catatan.trim()) {
        alert("Catatan admin wajib diisi.");
        return;
    }

    try {
        const response = await fetch(
          `/api/v1/admin/visitors/${encodeURIComponent(visitId)}/resolve-expired`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ status, catatan }),
          },
        );
        const result = await response.json();
        if (!response.ok) {
          throw new Error(result.detail || "Gagal memperbarui status kunjungan.");
        }
        fetchVisitors(currentPage);
    } catch (error) {
        alert(error.message || "Gagal memperbarui status kunjungan.");
    }
  }

  function renderPagination(totalPages, currentPage) {
    const container = document.getElementById("pagination-controls");
    container.innerHTML = "";

    if (totalPages <= 1) return;

    // Tombol Previous
    container.innerHTML += `
            <li class="page-item ${currentPage === 1 ? "disabled" : ""}">
                <a class="page-link" href="#" onclick="fetchVisitors(${currentPage - 1}); return false;">&laquo;</a>
            </li>
        `;

    // Tombol Angka
    for (let i = 1; i <= totalPages; i++) {
      // Batasi tampilan maksimal 5 halaman di tengah
      if (
        i === 1 ||
        i === totalPages ||
        (i >= currentPage - 1 && i <= currentPage + 1)
      ) {
        container.innerHTML += `
                    <li class="page-item ${i === currentPage ? "active" : ""}">
                        <a class="page-link" href="#" onclick="fetchVisitors(${i}); return false;">${i}</a>
                    </li>
                `;
      } else if (i === currentPage - 2 || i === currentPage + 2) {
        container.innerHTML += `<li class="page-item disabled"><a class="page-link" href="#">...</a></li>`;
      }
    }

    // Tombol Next
    container.innerHTML += `
            <li class="page-item ${currentPage === totalPages ? "disabled" : ""}">
                <a class="page-link" href="#" onclick="fetchVisitors(${currentPage + 1}); return false;">&raquo;</a>
            </li>
        `;
  }

  // Fitur pencarian dengan tombol Enter
  document
    .getElementById("searchInput")
    .addEventListener("keypress", function (e) {
      if (e.key === "Enter") {
        fetchVisitors(1);
      }
    });

  // Initialize the date controls in the browser's local timezone.
  const now = new Date();
  document.getElementById("dateFilter").value = [
    now.getFullYear(),
    String(now.getMonth() + 1).padStart(2, "0"),
    String(now.getDate()).padStart(2, "0"),
  ].join("-");
  document.getElementById("monthFilter").value = [
    now.getFullYear(),
    String(now.getMonth() + 1).padStart(2, "0"),
  ].join("-");
  fetchVisitors(1);
</script>
{% endblock %}

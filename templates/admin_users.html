{% extends "admin_base.html" %} {% block content %}
<div class="card border-0 shadow-sm">
  <div
    class="card-header bg-white py-3 d-flex justify-content-between align-items-center"
  >
    <h5 class="mb-0 fw-semibold">
      <i class="bi bi-people text-primary"></i> Manajemen Pengguna
    </h5>
    <button class="btn btn-primary btn-sm" onclick="openModal()">
      <i class="bi bi-person-plus"></i> Tambah Pengguna
    </button>
  </div>

  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover table-striped mb-0">
        <thead class="table-light">
          <tr>
            <th class="ps-4" style="width: 80px">ID</th>
            <th>Nama Lengkap</th>
            <th>Username</th>
            <th>Peran</th>
            <th>Pos</th>
            <th class="text-end pe-4" style="width: 200px">Aksi</th>
          </tr>
        </thead>
        <tbody id="user-table-body">
          <tr>
            <td colspan="6" class="text-center py-4 text-muted">
              Memuat data...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal Tambah/Edit User -->
<div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">Tambah Pengguna</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <form id="userForm">
        <div class="modal-body">
          <input type="hidden" id="userId" value="" />
          <div class="mb-3">
            <label class="form-label fw-semibold">Nama Lengkap</label>
            <input type="text" id="userNama" class="form-control" required />
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Username</label>
            <input
              type="text"
              id="userUsername"
              class="form-control"
              required
            />
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold"
              >Password (Kosongkan jika tidak diubah)</label
            >
            <input type="password" id="userPassword" class="form-control" />
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Peran</label>
            <select id="userPeran" class="form-select" required>
              <option value="security">Security</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Pos Security</label>
            <select id="userPos" class="form-select">
              <option value="">Pilih pos</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal"
          >
            Batal
          </button>
          <button type="submit" class="btn btn-primary" id="btnSave">
            Simpan
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  let userModal;
  const posNamesById = {};
  document.addEventListener("DOMContentLoaded", () => {
    userModal = new bootstrap.Modal(document.getElementById("userModal"));
    fetchPositions();
    fetchUsers();
  });

  async function fetchPositions() {
    const select = document.getElementById("userPos");
    try {
      const res = await fetch("/api/v1/api/pos/all");
      if (!res.ok) throw new Error("Gagal memuat daftar pos");
      const positions = await res.json();
      positions.forEach((pos) => {
        const option = document.createElement("option");
        option.value = pos.id_pos;
        option.textContent = pos.nama_pos;
        posNamesById[pos.id_pos] = pos.nama_pos;
        select.appendChild(option);
      });
    } catch (error) {
      console.error("Gagal memuat daftar pos:", error);
      select.innerHTML = '<option value="">Gagal memuat daftar pos</option>';
      select.disabled = true;
    }
  }

  async function fetchUsers() {
    const tbody = document.getElementById("user-table-body");
    try {
      // Menggunakan endpoint dari auth.py
      const res = await fetch("/api/v1/auth/users");
      const data = await res.json();

      tbody.innerHTML = "";
      if (data.length === 0) {
        tbody.innerHTML =
          '<tr><td colspan="6" class="text-center py-4 text-muted">Belum ada data Pengguna.</td></tr>';
        return;
      }

      data.forEach((item) => {
        let roleBadge = item.peran === "admin" ? "bg-danger" : "bg-primary";
        tbody.innerHTML += `
                    <tr>
                        <td class="ps-4 text-muted">#${item.id_pengguna}</td>
                        <td class="fw-semibold">${item.nama}</td>
                        <td>${item.user_name}</td>
                        <td><span class="badge ${roleBadge}">${item.peran}</span></td>
                        <td>${posNamesById[item.id_pos] ?? "-"}</td>
                        <td class="text-end pe-4">
                            <button class="btn btn-sm btn-warning me-1" onclick="editUser(${item.id_pengguna}, '${item.nama}', '${item.user_name}', '${item.peran}', '${item.id_pos ?? ""}')">
                                <i class="bi bi-pencil"></i> Edit
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="deleteUser(${item.id_pengguna})">
                                <i class="bi bi-trash"></i> Hapus
                            </button>
                        </td>
                    </tr>
                `;
      });
    } catch (error) {
      console.error("Gagal load User:", error);
      tbody.innerHTML =
        '<tr><td colspan="6" class="text-center py-4 text-danger">Gagal memuat data.</td></tr>';
    }
  }

  function openModal() {
    document.getElementById("modalTitle").innerText = "Tambah Pengguna";
    document.getElementById("userForm").reset();
    document.getElementById("userId").value = "";
    document.getElementById("userUsername").readOnly = false;
    document.getElementById("userPos").value = "";
    document.getElementById("userPassword").required = true; // Wajib saat tambah baru
    userModal.show();
  }

  function editUser(id, nama, username, peran, posId) {
    document.getElementById("modalTitle").innerText = "Edit Pengguna";
    document.getElementById("userId").value = id;
    document.getElementById("userNama").value = nama;
    document.getElementById("userUsername").value = username;
    document.getElementById("userUsername").readOnly = true; // Username tidak boleh diubah
    document.getElementById("userPeran").value = peran;
    document.getElementById("userPos").value = posId;
    document.getElementById("userPassword").required = false; // Opsional saat edit
    userModal.show();
  }

  document.getElementById("userForm").onsubmit = async (e) => {
    e.preventDefault();
    const id = document.getElementById("userId").value;
    const nama = document.getElementById("userNama").value.trim();
    const username = document.getElementById("userUsername").value.trim();
    const password = document.getElementById("userPassword").value;
    const peran = document.getElementById("userPeran").value;
    const id_pos = document.getElementById("userPos").value;
    const btn = document.getElementById("btnSave");

    btn.disabled = true;
    btn.innerText = "Menyimpan...";

    try {
      const isEdit = id !== "";
      let url, method, payload;

      if (isEdit) {
        url = `/api/v1/auth/users/${id}`;
        method = "PUT";
        payload = { nama: nama, peran: peran, id_pos: id_pos ? Number(id_pos) : null };
        if (password) payload.password = password;
      } else {
        url = `/api/v1/auth/users`;
        method = "POST";
        payload = {
          nama: nama,
          user_name: username,
          password: password,
          peran: peran,
          id_pos: id_pos ? Number(id_pos) : null,
        };
      }

      const res = await fetch(url, {
        method: method,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });

      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.detail || "Gagal menyimpan data");
      }

      userModal.hide();
      fetchUsers();
    } catch (error) {
      alert(`Error: ${error.message}`);
    } finally {
      btn.disabled = false;
      btn.innerText = "Simpan";
    }
  };

  async function deleteUser(id) {
    if (!confirm("Apakah Anda yakin ingin menghapus Pengguna ini?")) return;
    try {
      const res = await fetch(`/api/v1/auth/users/${id}`, { method: "DELETE" });
      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.detail || "Gagal menghapus data");
      }
      fetchUsers();
    } catch (error) {
      alert(`Error: ${error.message}`);
    }
  }
</script>
{% endblock %}

{% extends "admin_base.html" %} {% block content %}
<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
  <div>
    <h3 class="fw-bold mb-1">Dashboard</h3>
    <p class="text-muted mb-0">Ringkasan dan pemantauan kunjungan hari ini.</p>
  </div>
</div>

<!-- Kartu Statistik -->
<div class="row g-3 mb-4">
  <div class="col-6 col-md-4 col-xl">
    <div class="card border-0 stat-card stat-blue h-100">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-start">
          <div>
            <h6 class="text-uppercase mb-2 opacity-75">Pengunjung Hari Ini</h6>
            <h2 class="fw-bold mb-0" id="stat-total">0</h2>
          </div>
          <i class="bi bi-people fs-2 opacity-75"></i>
        </div>
      </div>
    </div>
  </div>
  <div class="col-6 col-md-4 col-xl">
    <div class="card border-0 stat-card stat-green h-100">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-start">
          <div>
            <h6 class="text-uppercase mb-2 opacity-75">Area Komplek</h6>
            <h2 class="fw-bold mb-0" id="stat-in-visit">0</h2>
          </div>
          <i class="bi bi-person-walking fs-2 opacity-75"></i>
        </div>
      </div>
    </div>
  </div>
  <div class="col-6 col-md-4 col-xl">
    <div class="card border-0 stat-card stat-amber h-100">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-start">
          <div>
            <h6 class="text-uppercase mb-2 opacity-75">Dalam Pos Tujuan</h6>
            <h2 class="fw-bold mb-0" id="stat-in-location">0</h2>
          </div>
          <i class="bi bi-geo-alt fs-2 opacity-75"></i>
        </div>
      </div>
    </div>
  </div>
  <div class="col-6 col-md-4 col-xl">
    <div class="card border-0 stat-card stat-completed h-100">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-start">
          <div>
            <h6 class="text-uppercase mb-2 opacity-75">Selesai Hari Ini</h6>
            <h2 class="fw-bold mb-0" id="stat-completed">0</h2>
          </div>
          <i class="bi bi-check-circle fs-2 opacity-75"></i>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Tabel Live Monitoring -->
<div class="card border-0 shadow-sm">
  <div
    class="card-header bg-white py-3 d-flex justify-content-between align-items-center flex-wrap gap-2"
  >
    <h5 class="mb-0 fw-semibold">
      <i class="bi bi-broadcast text-danger"></i> Live Monitoring
    </h5>
    <button class="btn btn-sm btn-outline-primary" onclick="fetchLiveData()">
      <i class="bi bi-arrow-clockwise"></i> Refresh
    </button>
  </div>
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover table-striped mb-0">
        <thead class="table-light">
          <tr>
            <th>Kode QR</th>
            <th>Nama Pengunjung</th>
            <th>Tujuan</th>
            <th>Waktu Masuk</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="live-table-body">
          <tr>
            <td colspan="5" class="text-center py-4 text-muted">
              Memuat data...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  // Fungsi mengambil statistik
  async function fetchStats() {
    try {
      const res = await fetch("/api/v1/admin/dashboard/stats");
      if (!res.ok) throw new Error("Gagal ambil stats");
      const data = await res.json();

      document.getElementById("stat-total").innerText = data.total_today;
      document.getElementById("stat-in-location").innerText = data.in_location;
      document.getElementById("stat-in-visit").innerText = data.in_visit;
      document.getElementById("stat-completed").innerText = data.completed_today;
    } catch (err) {
      console.error("Error Statistik:", err);
    }
  }

  // Fungsi mengambil data live monitoring
  async function fetchLiveData() {
    try {
      const response = await fetch("/api/v1/admin/dashboard/live-monitoring");
      if (!response.ok) throw new Error("Gagal ambil live monitoring");

      const data = await response.json();
      const tbody = document.getElementById("live-table-body");
      tbody.innerHTML = "";

      if (data.length === 0) {
        tbody.innerHTML =
          '<tr><td colspan="5" class="text-center py-4 text-muted">Belum ada pengunjung aktif.</td></tr>';
        return;
      }

      data.forEach((item) => {
        let badgeClass = "bg-secondary";
        let statusLabel = item.status;
        if (item.status === "DALAM_LOKASI") {
          badgeClass = "status-pos-tujuan";
          statusLabel = "DALAM POS TUJUAN";
        }
        if (item.status === "DALAM_KUNJUNGAN") {
          badgeClass = "status-area-komplek";
          statusLabel = "AREA KOMPLEK";
        }
        if (item.status === "DRAFT") badgeClass = "bg-info text-dark";

        tbody.innerHTML += `
                    <tr>
                        <td><span class="badge bg-secondary font-monospace fs-6">${item.kode}</span></td>
                        <td class="fw-semibold">${item.nama}</td>
                        <td>${item.tujuan}</td>
                        <td>${item.waktu}</td>
                        <td><span class="badge ${badgeClass}">${statusLabel}</span></td>
                    </tr>
                `;
      });
    } catch (error) {
      console.error("Error Live Monitoring:", error);
      // Jangan hapus tabel jika error sesaat, biarkan data lama tampil
    }
  }

  // Fungsi untuk menjalankan semua
  function refreshDashboard() {
    fetchStats();
    fetchLiveData();
  }

  // Jalankan saat halaman pertama kali dimuat
  document.addEventListener("DOMContentLoaded", () => {
    refreshDashboard();

    // Set interval untuk refresh otomatis setiap 5 detik
    setInterval(refreshDashboard, 5000);
  });
</script>
{% endblock %}

{% extends "admin_base.html" %} {% block content %}
<div class="card border-0 shadow-sm">
  <div
    class="card-header bg-white py-3 d-flex justify-content-between align-items-center"
  >
    <h5 class="mb-0 fw-semibold">
      <i class="bi bi-building text-primary"></i> Manajemen Mitra Perusahaan
    </h5>
    <button class="btn btn-primary btn-sm" onclick="openModal()">
      <i class="bi bi-plus-lg"></i> Tambah Mitra
    </button>
  </div>

  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover table-striped mb-0">
        <thead class="table-light">
          <tr>
            <th class="ps-4" style="width: 80px">ID</th>
            <th>Nama Perusahaan</th>
            <th class="text-end pe-4" style="width: 200px">Aksi</th>
          </tr>
        </thead>
        <tbody id="mitra-table-body">
          <tr>
            <td colspan="3" class="text-center py-4 text-muted">
              Memuat data...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal Tambah/Edit Mitra -->
<div class="modal fade" id="mitraModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">Tambah Mitra</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <form id="mitraForm">
        <div class="modal-body">
          <input type="hidden" id="mitraId" value="" />
          <div class="mb-3">
            <label class="form-label fw-semibold">Nama Perusahaan</label>
            <input
              type="text"
              id="mitraName"
              class="form-control"
              placeholder="Contoh: PT Teknologi Maju"
              required
            />
          </div>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal"
          >
            Batal
          </button>
          <button type="submit" class="btn btn-primary" id="btnSave">
            Simpan
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  let mitraModal;
  document.addEventListener("DOMContentLoaded", () => {
    mitraModal = new bootstrap.Modal(document.getElementById("mitraModal"));
    fetchMitra();
  });

  async function fetchMitra() {
    const tbody = document.getElementById("mitra-table-body");
    try {
      const res = await fetch("/api/v1/api/mitra/all");
      const data = await res.json();

      tbody.innerHTML = "";
      if (data.length === 0) {
        tbody.innerHTML =
          '<tr><td colspan="3" class="text-center py-4 text-muted">Belum ada data Mitra.</td></tr>';
        return;
      }

      data.forEach((item) => {
        tbody.innerHTML += `
                    <tr>
                        <td class="ps-4 text-muted">#${item.id_perusahaan}</td>
                        <td class="fw-semibold">${item.nama_perusahaan}</td>
                        <td class="text-end pe-4">
                            <button class="btn btn-sm btn-warning me-1" onclick="editMitra(${item.id_perusahaan}, '${item.nama_perusahaan}')">
                                <i class="bi bi-pencil"></i> Edit
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="deleteMitra(${item.id_perusahaan})">
                                <i class="bi bi-trash"></i> Hapus
                            </button>
                        </td>
                    </tr>
                `;
      });
    } catch (error) {
      console.error("Gagal load Mitra:", error);
      tbody.innerHTML =
        '<tr><td colspan="3" class="text-center py-4 text-danger">Gagal memuat data.</td></tr>';
    }
  }

  function openModal() {
    document.getElementById("modalTitle").innerText = "Tambah Mitra";
    document.getElementById("mitraForm").reset();
    document.getElementById("mitraId").value = "";
    mitraModal.show();
  }

  function editMitra(id, nama) {
    document.getElementById("modalTitle").innerText = "Edit Mitra";
    document.getElementById("mitraId").value = id;
    document.getElementById("mitraName").value = nama;
    mitraModal.show();
  }

  document.getElementById("mitraForm").onsubmit = async (e) => {
    e.preventDefault();
    const id = document.getElementById("mitraId").value;
    const nama = document.getElementById("mitraName").value.trim();
    const btn = document.getElementById("btnSave");

    if (!nama) return alert("Nama perusahaan wajib diisi!");

    btn.disabled = true;
    btn.innerText = "Menyimpan...";

    try {
      const isEdit = id !== "";
      const url = isEdit
        ? `/api/v1/api/mitra/update/${id}`
        : `/api/v1/api/mitra/create`;
      const method = isEdit ? "PUT" : "POST";

      const res = await fetch(url, {
        method: method,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nama_perusahaan: nama }),
      });

      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.detail || "Gagal menyimpan data");
      }

      mitraModal.hide();
      fetchMitra();
    } catch (error) {
      alert(`Error: ${error.message}`);
    } finally {
      btn.disabled = false;
      btn.innerText = "Simpan";
    }
  };

  async function deleteMitra(id) {
    if (!confirm("Apakah Anda yakin ingin menghapus Mitra ini?")) return;
    try {
      const res = await fetch(`/api/v1/api/mitra/delete/${id}`, {
        method: "DELETE",
      });
      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.detail || "Gagal menghapus data");
      }
      fetchMitra();
    } catch (error) {
      alert(`Error: ${error.message}`);
    }
  }
</script>
{% endblock %}

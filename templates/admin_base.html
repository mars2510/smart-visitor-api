<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }} - Admin Panel</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/assets/css/admin.css?v=20261109-6" />
  </head>
  <body class="bg-light">
    <div class="d-flex" id="wrapper">
      <!-- Sidebar -->
      <div
        class="bg-dark text-white border-end"
        id="sidebar-wrapper"
        style="min-width: 250px; min-height: 100vh"
      >
        <div
          class="sidebar-heading text-center py-4 fs-4 fw-bold border-bottom border-secondary"
        >
          <i class="bi bi-shield-check"></i> VMS Admin
        </div>
        <div class="list-group list-group-flush mt-3">
          <a
            href="/admin"
            class="list-group-item list-group-item-action list-group-item-dark bg-dark text-white border-0 {% if title == 'Dashboard' %}active{% endif %}"
          >
            <i class="bi bi-speedometer2 me-2"></i> Dashboard
          </a>

          <!-- Menu Deteksi anomali -->
          <a
            href="/admin/anomaly"
            class="list-group-item list-group-item-action list-group-item-dark bg-dark text-white border-0 {% if title == 'Anomaly Detection' %}active{% endif %}"
          >
            <i class="bi bi-robot me-2"></i> Deteksi Anomali
          </a>

          <!-- Menu Data Pengunjung -->
          <a
            href="/admin/visitors"
            class="list-group-item list-group-item-action list-group-item-dark bg-dark text-white border-0 {% if title == 'Data Pengunjung' %}active{% endif %}"
          >
            <i class="bi bi-people me-2"></i> Data Pengunjung
          </a>

          <!-- Menu Master Pos -->
          <a
            href="/admin/pos"
            class="list-group-item list-group-item-action list-group-item-dark bg-dark text-white border-0 {% if title == 'Manajemen POS' %}active{% endif %}"
          >
            <i class="bi bi-geo-alt me-2"></i> Master POS
          </a>

          <!-- Menu Log -->
          <a
            href="/admin/logs"
            class="list-group-item list-group-item-action list-group-item-dark bg-dark text-white border-0 {% if title == 'Log Aktivitas' %}active{% endif %}"
          >
            <i class="bi bi-clock-history me-2"></i> Log Aktivitas
          </a>

          <!--Menu Mitra -->
          <a
            href="/admin/mitra"
            class="list-group-item list-group-item-action list-group-item-dark bg-dark text-white border-0 {% if title == 'Manajemen Mitra' %}active{% endif %}"
          >
            <i class="bi bi-building me-2"></i> Mitra Perusahaan
          </a>

          <!-- Menu Pengguna -->
          <a
            href="/admin/users"
            class="list-group-item list-group-item-action list-group-item-dark bg-dark text-white border-0 {% if title == 'Manajemen Pengguna' %}active{% endif %}"
          >
            <i class="bi bi-people me-2"></i> Data Pengguna
          </a>
        </div>
      </div>

      <!-- Page Content -->
      <div id="page-content-wrapper" class="w-100">
        <!-- Navbar -->
        <nav
          class="navbar navbar-expand-lg navbar-light bg-white border-bottom px-4 py-3"
        >
          <div class="dropdown ms-auto">
            <button
              class="btn admin-profile-trigger d-flex align-items-center gap-2 text-start"
              type="button"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              <span class="admin-profile-avatar">
                <i class="bi bi-person-fill"></i>
              </span>
              <span class="d-flex flex-column">
                <span class="fw-semibold">{{ user.user_name if user else 'Administrator' }}</span>
                <span class="small text-muted">{{ (user.email or (user.nama if '@' in user.nama else 'Email belum diatur')) if user else '' }}</span>
              </span>
              <i class="bi bi-chevron-down small text-muted ms-1"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm">
              <li>
                <button class="dropdown-item text-danger" type="button" onclick="logout()">
                  <i class="bi bi-box-arrow-right me-2"></i>Logout
                </button>
              </li>
            </ul>
          </div>

          <script>
            function logout() {
              // Hapus cookie token
              document.cookie =
                "access_token=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT";
              window.location.href = "/login";
            }
          </script>
        </nav>

        <!-- Konten Dinamis -->
        <div class="container-fluid px-4 py-4">
          {% block content %}{% endblock %}
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
